<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17131f">
  <title>Open Doors | Career & Workforce Academy</title>
  <style>
    :root { color-scheme: dark; --bg:#17131f; --panel:#211b2b; --accent:#e34bb8; --text:#f7f2fb; --muted:#c8bfd1; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(ellipse at top,#35243e 0%,var(--bg) 58%); color:var(--text); }
    main { width:min(100%,720px); padding:clamp(26px,6vw,52px); border:1px solid #51415c; border-radius:24px; background:rgba(33,27,43,.92); box-shadow:0 24px 70px #0005; }
    .eyebrow { color:var(--accent); font-weight:700; letter-spacing:.16em; text-transform:uppercase; font-size:.78rem; }
    h1 { margin:.55rem 0 1rem; font-size:clamp(2rem,7vw,3.5rem); line-height:1.05; }
    p { color:var(--muted); line-height:1.7; font-size:1.05rem; }
    a { display:inline-block; margin-top:1.25rem; padding:14px 20px; border-radius:12px; background:var(--accent); color:#190f1a; font-weight:800; text-decoration:none; }
    a:focus-visible { outline:3px solid white; outline-offset:4px; }
    footer { margin-top:2rem; color:#9c91a8; font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Operation Open Doors</div>
    <h1>Career &amp; Workforce Academy</h1>
    <p>Practical training. Real-world skills. New opportunities.</p>
    <p>Explore the HVAC Dispatch Center training simulator, built to practice customer intake, scheduling, dispatch, and service coordination.</p>
    <a href="https://jennansc.github.io/open-doors-dispatch-center/">Open the Dispatch Center</a>
    <footer>Learning opens doors.</footer>
  </main>
</body>
</html>
